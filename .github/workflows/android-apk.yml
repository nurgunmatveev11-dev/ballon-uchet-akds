name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: |
          mkdir -p android/build
          cp android/app/build/outputs/apk/debug/app-debug.apk android/build/ballon-uchet-akds-0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ballon-uchet-akds-apk
          path: android/build/ballon-uchet-akds-0.2.0.apk
          retention-days: 30
      - name: Publish demo APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 android/build/ballon-uchet-akds-0.2.0.apk \
            --target main \
            --title 'Баллон.учёт 0.2.0 (демо APK)' \
            --notes 'Android APK для учёта баллонов. Требуется интернет и аккаунт приложения Supabase. Демо сборка подписана отладочным ключом.'

